<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sem Domínio | Gerenciar Jogadores</title>

  <link rel="stylesheet" href="common-nav.css" />
  <link rel="stylesheet" href="adicionar.css" />
</head>
<body>

<header class="app-header">
  <div class="brand">
    <a href="https://www.semdominio.online" target="_blank" rel="noopener" class="brand-link">
      <h1>Sem Domínio</h1>
    </a>
  </div>

  <nav class="app-nav">
    <ul>
      <li><a href="https://www.semdominio.online">Classificação</a></li>
    </ul>
  </nav>
</header>

<main class="app-main">

  <section class="monthly-control" aria-labelledby="monthlyTitle">
    <div>
      <p class="monthly-kicker">CONTROLE DE COMPETÊNCIA</p>
      <h2 id="monthlyTitle">Mês atual: carregando...</h2>
      <p id="monthlySummary">Consultando os dados da competência aberta.</p>
    </div>
    <button type="button" id="closeMonthBtn" class="close-month-btn">Fechar mês</button>
  </section>

  <section class="history-section">
    <header class="section-header"><h2>📅 Meses anteriores</h2></header>
    <div id="competenciaList" class="competencia-list"><p class="loading">Carregando histórico...</p></div>
    <div id="historyRanking" class="history-ranking hidden"></div>
  </section>

  <!-- FORMULÁRIO -->
  <section class="form-section">
    <header class="section-header">
      <h2 id="formTitle">➕ Novo Registro</h2>
    </header>

    <form id="playerForm" class="player-form">
      <input type="hidden" id="playerId" />

      <!-- TIPO -->
      <div class="form-group">
        <label for="tipo">Tipo *</label>
        <select id="tipo" required>
          <option value="jogadores">Jogador</option>
          <option value="goleiros">Goleiro</option>
        </select>
      </div>

      <!-- NOME -->
      <div class="form-group">
        <label for="nome">Nome *</label>
        <input
          type="text"
          id="nome"
          placeholder="Digite o nome"
          required
        />
      </div>

      <!-- FOTO -->
      <div class="form-group">
        <label for="foto">Foto</label>
        <input
          type="text"
          id="foto"
          placeholder="URL da foto"
        />
      </div>

      <!-- ESTATÍSTICAS -->
      <div class="form-grid">
        <input type="number" id="gols" placeholder="Gols" min="0" />
        <input type="number" id="vitorias" placeholder="Vitórias" min="0" />
        <input type="number" id="empate" placeholder="Empates" min="0" />
        <input type="number" id="defesa" placeholder="Defesas" min="0" />
        <input type="number" id="infracoes" placeholder="Infrações" min="0" />
      </div>

      <!-- AÇÕES -->
      <div class="form-actions">
        <button type="submit" id="submitBtn">Salvar</button>
        <button
          type="button"
          id="cancelEdit"
          class="secondary hidden"
        >
          Cancelar edição
        </button>
      </div>
    </form>
  </section>

  <!-- LISTA -->
  <section class="list-section">
    <header class="section-header">
      <h2>📋 Registros Cadastrados</h2>
    </header>

    <ul id="playerList" class="player-list"></ul>
  </section>

</main>

<!-- FEEDBACK -->
<div id="feedback" aria-live="polite"></div>

<script type="module" src="./globais.js"></script>
<script type="module" src="./adicionar.js"></script>

</body>
</html>
